name: Django CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: course_reg_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d course_reg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret-key-for-checks-0123456789
      DJANGO_DEBUG: "false"
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost,https://testserver
      DATABASE_ENGINE: postgresql
      DATABASE_SSL_REQUIRE: "false"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/course_reg_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Run Django checks
        run: |
          python manage.py check
          python manage.py check --deploy
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Run PostgreSQL concurrency test
        run: python manage.py test core.tests.PostgreSQLConcurrentRegistrationTests --verbosity 2
      - name: Run tests on PostgreSQL
        run: python manage.py test --verbosity 2
