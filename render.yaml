services:
  - type: web
    name: course-reg
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --access-logfile /dev/null --error-logfile -
    healthCheckPath: /healthz/
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_ENGINE
        value: postgresql
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: course-reg-db
          property: connectionString

databases:
  - name: course-reg-db
    databaseName: course_reg
    user: course_reg
    plan: free
    region: oregon
